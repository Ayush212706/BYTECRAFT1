[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytecraft"
version = "1.0.0"
description = "A tiny educational language, bytecode compiler, and virtual machine"
requires-python = ">=3.10"
authors = [{name = "ByteCraft Project"}]
license = {text = "MIT"}

[project.scripts]
bytecraft = "bytecraft.cli:main"

[tool.setuptools]
packages = ["bytecraft"]
